! frr-1: FRRouting bgpd, cabled to nanonos-1 on eth0.
hostname frr-1
log file /tmp/labq-lab/frr/bgpd.log informational
router bgp 65002
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.0.0.0 remote-as 4200000001
 neighbor 10.0.0.0 password labq-interop-md5
 neighbor 10.0.0.0 timers connect 2
 address-family ipv4 unicast
  network 10.99.0.0/16
 exit-address-family
