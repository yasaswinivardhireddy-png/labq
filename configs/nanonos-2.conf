! nanonos-2: cabled to nanonos-1 on Ethernet0.
hostname nanonos-2
interface Ethernet0
  port n2-n1
  description nanonos-1 Ethernet1
  ip address 10.0.1.1/31
lldp
  tx-interval 2
router bgp 4200000002
  router-id 10.255.0.2
  timers 1 3
  timers connect-retry 2
  network 10.1.2.0/24
  neighbor 10.0.1.0 remote-as 4200000001
  neighbor 10.0.1.0 description nanonos-1
  neighbor 10.0.1.0 ttl-security hops 1
