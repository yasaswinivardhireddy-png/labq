! nanonos-1: cabled to the FRRouting router on Ethernet0 (eBGP with TCP-MD5) and to nanonos-2
! on Ethernet1 (eBGP with GTSM). LabQ's fabric jobs shut and restore Ethernet1.
hostname nanonos-1
interface Ethernet0
  port n1-frr
  description frr-1 eth0
  ip address 10.0.0.0/31
interface Ethernet1
  port n1-n2
  description nanonos-2 Ethernet0
  ip address 10.0.1.0/31
lldp
  tx-interval 2
router bgp 4200000001
  router-id 10.255.0.1
  timers 1 3
  timers connect-retry 2
  network 10.1.1.0/24
  neighbor 10.0.0.1 remote-as 65002
  neighbor 10.0.0.1 description frr-1
  neighbor 10.0.0.1 password labq-interop-md5
  neighbor 10.0.1.1 remote-as 4200000002
  neighbor 10.0.1.1 description nanonos-2
  neighbor 10.0.1.1 ttl-security hops 1
